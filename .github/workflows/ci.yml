---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: betterleaks-history --hook-stage manual --all-files
